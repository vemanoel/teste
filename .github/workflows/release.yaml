name: release

on:
  workflow_dispatch: 
    inputs:
      version_name:
        type: string
        required: true
        description: "VERSION NAME"
      version_code:
        type: string
        required: true
        description: "VERSION CODE"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
  
      - name: Update packages
        run: sudo apt-get update --yes
  
      - name: Install podman
        run: sudo apt-get install --yes podman
      
      - name: Install podman-compose
        run: sudo apt-get install --yes podman-compose
    
      - name: Build artifacts
        run: make up setup build
        env:
          NPM_INSTALL_EXTRA_ARGS: "--omit=dev"
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}

      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: apks/*
          generate_release_notes: true
          tag_name: v${{ inputs.version_name }}
  
